name: Build de déploiement

# Produit un dossier prêt à mettre en ligne à chaque poussée sur `main`, et
# permet de le publier sur Hostinger à la demande.
#
# La publication est **manuelle** (« Run workflow ») et non automatique sur
# `main` : mettre en ligne est une action visible par les joueurs, elle mérite
# un geste explicite. Pour la rendre automatique, remplacer la condition du
# job `publish` par `if: github.ref == 'refs/heads/main'`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Chemin de base (/ pour un domaine dédié)'
        required: false
        default: '/'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les configurations d'hébergement sont générées, pas écrites à la main :
      # la CI vérifie qu'elles sont à jour dans le dépôt.
      - name: Vérifier les configurations d'hébergement
        run: |
          pnpm generate:deploy
          git diff --exit-code deploy/generated \
            || (echo "::error::deploy/generated est périmé. Lancez 'pnpm generate:deploy' et committez." && exit 1)

      - name: Construire
        env:
          VITE_BASE: ${{ inputs.base || '/' }}
        run: pnpm build

      # Apache est la cible la plus probable (Hostinger). Le fichier est déposé
      # dans le build pour qu'un simple envoi FTP suffise.
      - name: Ajouter la configuration Apache au build
        run: cp deploy/generated/.htaccess apps/web/dist/.htaccess

      - name: Résumé
        run: |
          {
            echo "### Build prêt à déployer"
            echo ""
            echo "| Fichier | Taille |"
            echo "|---|---|"
            find apps/web/dist -maxdepth 2 -type f -printf '| `%P` | %s octets |\n' \
              | sort | head -25
            echo ""
            echo "Poids total : $(du -sh apps/web/dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chalk-dist
          path: apps/web/dist
          # Un mois suffit : chaque poussée sur main en produit un nouveau.
          retention-days: 30
          include-hidden-files: true

  publish:
    # Publication sur Hostinger, uniquement sur demande explicite et si les
    # secrets sont configurés. Sans eux, le job ne s'exécute pas — le build
    # reste disponible en artefact.
    needs: package
    if: inputs.publier
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Vérifier la configuration
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOSTINGER_HOST"
          [ -z "$USER" ] && missing="$missing HOSTINGER_USER"
          [ -z "$KEY" ] && missing="$missing HOSTINGER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing — voir docs/deploiement.md"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: chalk-dist
          path: dist

      - name: Préparer la clé SSH
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publier
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
          REMOTE: ${{ secrets.HOSTINGER_PATH || 'public_html/' }}
        run: |
          rsync --archive --compress --delete --human-readable \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes" \
            dist/ "$USER@$HOST:$REMOTE"

      - name: Vérifier le cache du service worker
        if: vars.CHALK_DOMAIN != ''
        run: |
          # Le contrôle le plus important après publication : sw.js mis en
          # cache fige les utilisateurs sur une ancienne version, et aucun
          # store ne permet de leur pousser un correctif.
          header=$(curl -sI "https://${{ vars.CHALK_DOMAIN }}/sw.js" | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "sw.js → ${header:-aucun en-tête Cache-Control}"
          case "$header" in
            *no-store*) echo "OK" ;;
            *) echo "::warning::sw.js devrait être en no-store. Vérifiez mod_headers et l'absence de règle mod_expires concurrente." ;;
          esac
