name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # §4.2 : le moteur de règles est le socle de tous les modes de jeu.
      # Le seuil de couverture est appliqué ici, pas seulement souhaité.
      - name: Tests + couverture du moteur
        run: pnpm --filter @chalk/core test:coverage

      - name: Build
        run: pnpm build
