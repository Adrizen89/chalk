# Généré par deploy/generate.mjs — ne pas modifier à la main.
# Cible : Netlify. À déposer à la racine du dépôt.

[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "apps/web/dist"

[[headers]]
  for = "/*"
  [headers.values]
    "Content-Security-Policy" = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    "Strict-Transport-Security" = "max-age=63072000; includeSubDomains"
    "X-Content-Type-Options" = "nosniff"
    "Referrer-Policy" = "strict-origin-when-cross-origin"
    "Permissions-Policy" = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    "Cross-Origin-Opener-Policy" = "same-origin"

# Porte la version. Mis en cache, il fige les utilisateurs sur une vieille version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Référence les fichiers hachés de la version courante.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Change rarement, mais doit pouvoir évoluer sans attendre l'expiration.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Noms hachés : un contenu différent produit un nom différent.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stables, mais sans hachage dans le nom.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Lus par iOS au lancement, jamais par le service worker.
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
