# Généré par deploy/generate.mjs — ne pas modifier à la main.
# Cible : nginx sur un VPS.

server {
  listen 443 ssl http2;
  server_name chalk.example;   # à remplacer

  root /var/www/chalk;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Porte la version. Mis en cache, il fige les utilisateurs sur une vieille version.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Référence les fichiers hachés de la version courante.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Change rarement, mais doit pouvoir évoluer sans attendre l'expiration.
  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Noms hachés : un contenu différent produit un nom différent.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Stables, mais sans hachage dans le nom.
  location /icons/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Lus par iOS au lancement, jamais par le service worker.
  location /splash/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Repli SPA (§3.2).
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# §6 — HTTPS obligatoire.
server {
  listen 80;
  server_name chalk.example;
  return 301 https://$host$request_uri;
}
