<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- §3.2 : viewport-fit=cover pour dessiner sous l'encoche, les safe areas
         sont gérées en CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Marqueur de points aux fléchettes : X01, Cricket, Killer, Around the Clock. Fonctionne hors ligne."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />

    <!-- §3.2 : sur iOS, sans apple-touch-icon, l'écran d'accueil affiche une
         capture de la page en guise d'icône. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chalk" />

    <!-- Écrans de démarrage iOS — générés par scripts/generate-assets.mjs.
         Sans eux, l'ouverture depuis l'écran d'accueil affiche un écran blanc. -->

      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/splash-440x956@3x.png"
    />

      rel="apple-touch-startup-image"
